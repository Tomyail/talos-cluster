---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: penpot
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: penpot-secret
    template:
      engineVersion: v2
      data:
        PENPOT_DATABASE_URI: postgresql://dev-postgres16-rw.database.svc.cluster.local:5432/penpot
        PENPOT_DATABASE_USERNAME: &dbUser "{{ .PENPOT_DB_USER }}"
        PENPOT_DATABASE_PASSWORD: &dbPass "{{ .PENPOT_DB_PASS }}"
        PENPOT_SECRET_KEY: "{{ .PENPOT_SECRET_KEY }}"
        # Postgres Init
        INIT_POSTGRES_DBNAME: penpot
        INIT_POSTGRES_HOST: dev-postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  data:
    - secretKey: POSTGRES_SUPER_PASS
      remoteRef:
        key: cloudnative-pg
        property: password
    - secretKey: PENPOT_DB_USER
      remoteRef:
        key: penpot-db
        property: username
    - secretKey: PENPOT_DB_PASS
      remoteRef:
        key: penpot-db
        property: password
    - secretKey: PENPOT_SECRET_KEY
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: penpot
        property: PENPOT_SECRET_KEY
