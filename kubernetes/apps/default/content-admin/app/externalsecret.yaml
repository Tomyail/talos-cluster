---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# CloudKit 凭证不进 Git。维护者需在 Bitwarden 手工创建条目 content-admin-cloudkit，
# 该条目需要两个自定义字段（值取自本机 ~/.config/workout-narrator/cloudkit/）：
#   eckey.pem           ← ~/.config/workout-narrator/cloudkit/eckey.pem
#   key-id-development  ← ~/.config/workout-narrator/cloudkit/key-id-development
# 挂载到 Pod 的 /cloudkit 后就是同名文件，content-admin 从
# CLOUDKIT_CREDENTIALS_DIR=/cloudkit 读取它们。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: content-admin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: content-admin-secret
  data:
    # 键名带点号，因此不用 target.template（Go 模板里 .eckey.pem 无法取值）。
    - secretKey: eckey.pem
      remoteRef:
        key: content-admin-cloudkit
        property: eckey.pem
    - secretKey: key-id-development
      remoteRef:
        key: content-admin-cloudkit
        property: key-id-development
