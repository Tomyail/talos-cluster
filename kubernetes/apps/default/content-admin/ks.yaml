---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app content-admin
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # 用 components/volsync（而非 volsync-new）：它的 PVC 带 dataSourceRef 指向 ReplicationDestination，
  # 重建 PVC 时自动从最近一次 restic 备份恢复；首次部署时仓库为空，PVC 以空卷启动。
  components:
    - ../../../../components/volsync
    - ../../../../components/image-automation
  dependsOn:
    - name: topolvm
      namespace: storage
    - name: external-secrets
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/default/content-admin/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: true
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 5Gi
      REGISTRY_URL: gitea.tomyail.com/tomyail/workout-narrator-content-admin
      REGISTRY_HOST: gitea.tomyail.com
      BW_ID: d01d04c2-30c2-4afe-b19b-10dfaced8670
