---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gitea-runner
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      gitea-runner:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: gitea/runner
              tag: nightly-dind-rootless
            env:
              - name: DOCKER_HOST
                # value: tcp://localhost:2376
                value: unix:///run/user/1000/docker.sock
              # rootless dockerd 读 $HOME/.config/docker/daemon.json；
              # 显式钉住 HOME，避免镜像未设 ENV HOME 时读不到 insecure-registries 配置。
              - name: HOME
                value: /home/user
              # - name: DOCKER_TLS_VERIFY
              #   value: "1"
              # - name: DOCKER_CERT_PATH
              #   value: /certs/client
              - name: GITEA_INSTANCE_URL
                value: https://gitea.${SECRET_DOMAIN}
              - name: GITEA_RUNNER_LABELS
                value: "docker:docker://catthehacker/ubuntu:act-latest"
            envFrom:
              - secretRef:
                  name: gitea-runner-secret
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              privileged: true
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  # act_runner 由 s6 拉起；若 s6 的 docker 就绪监视进程死掉，容器主进程仍在，
                  # 探 docker 会误判健康，必须探真正的 runner 进程。
                  exec:
                    command: ["pidof", "gitea-runner"]
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 65536
    persistence:
      config:
        existingClaim: gitea-runner-vol
        globalMounts:
          - path: /data
      # rootless dind 的 daemon 配置（insecure-registries 指向 prod-registry egress Service）。
      # 必须挂在 ~/.config/docker 而不是 /etc/docker：rootless docker 只读前者。
      docker-config:
        type: configMap
        name: gitea-runner-docker-config
        globalMounts:
          - path: /home/user/.config/docker
            readOnly: true
      tmp:
        type: emptyDir
