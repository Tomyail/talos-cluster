# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app growth-tracker
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      growth-tracker:
        type: cronjob
        cronjob:
          schedule: "30 6 * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 86400
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4
            envFrom: &envFrom
              - secretRef:
                  name: growth-tracker-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: gitea.tomyail.com/tomyail/growth-tracker
              tag: "main-9f5e7740137f-1785251293" # {"$imagepolicy": "default:growth-tracker:tag"}
            args: ["sync"]
            envFrom: *envFrom
            env:
              TZ: ${TIMEZONE}
              # Not secret, so kept as plain config rather than in Bitwarden.
              UMAMI_BASE_URL: "https://umami.tomyail.com"
              UMAMI_WEBSITE_IDS: "b737f21d-b366-4de7-beca-217e7252a5a2=blog"
              # Vendor's sales report includes every app on the account;
              # this keeps only the three real shipped apps (excludes the
              # My Expo Go dev-shell app).
              ASC_APP_SKUS: "tubecast-ios-001,workout-narrator-ios,herdr-connect-ios"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        pod:
          restartPolicy: Never
    persistence:
      # readOnlyRootFilesystem needs a writable /tmp: both the `asc` CLI
      # (--output) and Go's os.CreateTemp write their sales-report scratch
      # file there.
      tmp:
        type: emptyDir
    defaultPodOptions:
      imagePullSecrets:
        - name: growth-tracker-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 65536
