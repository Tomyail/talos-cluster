---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: growth-tracker
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: growth-tracker-secret
    template:
      engineVersion: v2
      data:
        # Postgres
        DATABASE_URL: "postgres://{{ .GT_POSTGRES_USER }}:{{ .GT_POSTGRES_PASS }}@dev-postgres16-rw.database.svc.cluster.local:5432/growth_tracker?sslmode=disable"
        # Postgres Init
        INIT_POSTGRES_DBNAME: growth_tracker
        INIT_POSTGRES_HOST: "dev-postgres16-rw.database.svc.cluster.local"
        INIT_POSTGRES_USER: "{{ .GT_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .GT_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: '{{ .POSTGRES_SUPER_PASS }}'
        # Umami — confirmed against the live instance (umami.tomyail.com,
        # self-hosted v2) that it has no API key configured for this user,
        # so growth-tracker uses the username/password login flow. Base
        # URL/website IDs aren't sensitive, so they're plain env vars on the
        # container (see helmrelease.yaml) rather than templated here.
        UMAMI_USERNAME: "{{ .UMAMI_USERNAME }}"
        UMAMI_PASSWORD: "{{ .UMAMI_PASSWORD }}"
        # App Store Connect (Sales Reports, via the `asc` CLI)
        ASC_ISSUER_ID: "{{ .ASC_ISSUER_ID }}"
        ASC_KEY_ID: "{{ .ASC_KEY_ID }}"
        ASC_PRIVATE_KEY_B64: "{{ .ASC_PRIVATE_KEY_B64 }}"
        ASC_VENDOR_NUMBER: "{{ .ASC_VENDOR_NUMBER }}"
  data:
    - secretKey: POSTGRES_SUPER_PASS
      remoteRef:
        key: cloudnative-pg
        property: password

    - secretKey: GT_POSTGRES_USER
      remoteRef:
        key: growth-tracker-db
        property: username
    - secretKey: GT_POSTGRES_PASS
      remoteRef:
        key: growth-tracker-db
        property: password

    - secretKey: UMAMI_USERNAME
      remoteRef:
        key: umami.tomyail.com
        property: username
    - secretKey: UMAMI_PASSWORD
      remoteRef:
        key: umami.tomyail.com
        property: password

    - secretKey: ASC_ISSUER_ID
      remoteRef:
        key: growth-tracker-asc
        property: fields.issuer_id
    - secretKey: ASC_KEY_ID
      remoteRef:
        key: growth-tracker-asc
        property: fields.key_id
    - secretKey: ASC_PRIVATE_KEY_B64
      remoteRef:
        key: growth-tracker-asc
        property: fields.private_key_base64
    - secretKey: ASC_VENDOR_NUMBER
      remoteRef:
        key: growth-tracker-asc
        property: fields.vendor_number
