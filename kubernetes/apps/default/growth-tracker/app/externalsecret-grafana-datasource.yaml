---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Separate ExternalSecret (rather than folding into externalsecret.yaml) so
# the *target* Secret can be labeled for Grafana's sidecar datasource
# discovery — the label must sit on this Secret alone, since its data keys
# are each expected to be a Grafana datasource-provisioning YAML file, not
# arbitrary app config like the main growth-tracker-secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: growth-tracker-grafana-datasource
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: growth-tracker-grafana-datasource
    template:
      metadata:
        labels:
          grafana_datasource: "true"
      engineVersion: v2
      data:
        growth-tracker-postgres.yaml: |
          apiVersion: 1
          datasources:
            - name: Growth Tracker Postgres
              type: postgres
              uid: growth-tracker-postgres
              access: proxy
              url: dev-postgres16-rw.database.svc.cluster.local:5432
              database: growth_tracker
              user: {{ .GT_POSTGRES_USER }}
              secureJsonData:
                password: {{ .GT_POSTGRES_PASS }}
              jsonData:
                sslmode: disable
                postgresVersion: 1600
  data:
    - secretKey: GT_POSTGRES_USER
      remoteRef:
        key: growth-tracker-db
        property: username
    - secretKey: GT_POSTGRES_PASS
      remoteRef:
        key: growth-tracker-db
        property: password
