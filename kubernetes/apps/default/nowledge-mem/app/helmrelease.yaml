---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nowledge-mem
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      nowledge-mem:
        # Single writer: KuzuDB and the search index must never be opened twice.
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/nowledgelabs/mem
              tag: 0.10.103@sha256:ef96ca5a443212da98e445f240fa39279d1146ed9470670d95b6ce430746c005
            env:
              TZ: ${TIMEZONE}
              # Large conversation exports; must stay well below the memory limit.
              NOWLEDGE_MAX_REQUEST_BODY_SIZE: 2048MB
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: &port 14242
                  failureThreshold: 30
                  periodSeconds: 10
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      # One PVC, three subPaths: the container expects /var/lib, /etc and /var/cache
      # to be separate ownership-wise writable trees, but they back up best together.
      data:
        type: persistentVolumeClaim
        existingClaim: *app
        advancedMounts:
          nowledge-mem:
            app:
              - path: /var/lib/nowledge-mem
                subPath: data
              - path: /etc/nowledge-mem
                subPath: config
              - path: /var/cache/nowledge-mem
                subPath: cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
