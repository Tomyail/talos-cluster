---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asobeast
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: asobeast-secret
    template:
      engineVersion: v2
      data:
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        STORE_CONNECT_ENCRYPTION_KEY: "{{ .STORE_CONNECT_ENCRYPTION_KEY }}"
        POSTGRES_USER: &dbUser "{{ .ASOBEAST_POSTGRES_USER }}"
        POSTGRES_PASSWORD: &dbPass "{{ .ASOBEAST_POSTGRES_PASSWORD }}"
        DATABASE_URL: "postgresql://{{ .ASOBEAST_POSTGRES_USER }}:{{ .ASOBEAST_POSTGRES_PASSWORD }}@dev-postgres16-rw.database.svc.cluster.local:5432/asobeast"
        # Postgres Init
        INIT_POSTGRES_DBNAME: asobeast
        INIT_POSTGRES_HOST: dev-postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  data:
    - secretKey: POSTGRES_SUPER_PASS
      remoteRef:
        key: cloudnative-pg
        property: password
    - secretKey: ASOBEAST_POSTGRES_USER
      remoteRef:
        key: asobeast-db
        property: username
    - secretKey: ASOBEAST_POSTGRES_PASSWORD
      remoteRef:
        key: asobeast-db
        property: password
    - secretKey: AUTH_SECRET
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: asobeast
        property: AUTH_SECRET
    - secretKey: STORE_CONNECT_ENCRYPTION_KEY
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: asobeast
        property: STORE_CONNECT_ENCRYPTION_KEY
