---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app asobeast
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      asobeast:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
            env:
              INIT_POSTGRES_USER_FLAGS: "--createrole --bypassrls"
            envFrom: &envFrom
              - secretRef:
                  name: asobeast-secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          redis:
            image:
              repository: docker.io/library/redis
              tag: 7-alpine
            command:
              - redis-server
              - --maxmemory
              - 192mb
              - --maxmemory-policy
              - noeviction
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
          api:
            image:
              repository: ghcr.io/asobeast/asobeast-api
              tag: 1.15.0@sha256:6763ce85b82904ed994ae173d7473fe6627e574a43a215993f948f45156395ce
            env:
              TZ: ${TIMEZONE}
              PORT: &apiPort 4000
              NODE_ENV: production
              REDIS_HOST: 127.0.0.1
              REDIS_PORT: 6379
              DEFAULT_COUNTRY: us
              AUTH_COOKIE_SECURE: "true"
              WEB_PUBLIC_URL: https://aso.${SECRET_DOMAIN}
              TRUST_PROXY: 1
              LOG_LEVEL: log
            envFrom: *envFrom
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *apiPort
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *apiPort
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *apiPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1024Mi
          app:
            image:
              repository: ghcr.io/asobeast/asobeast-web
              tag: 1.15.0@sha256:02aaddea4b8e7b7747b2fecbdca42fdb0339f5eef4fdc00424001c2a9758f492
            env:
              TZ: ${TIMEZONE}
              PORT: &port 3000
              HOSTNAME: 0.0.0.0
              API_INTERNAL_URL: http://127.0.0.1:4000
              TRUST_PROXY: 1
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 20
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["aso.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      redis-data:
        type: emptyDir
        advancedMounts:
          asobeast:
            redis:
              - path: /data
