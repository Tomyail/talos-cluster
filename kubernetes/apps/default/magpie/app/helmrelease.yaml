---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app magpie
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      magpie:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/yetone/magpie
              tag: 0.1.1358@sha256:58708afd1cc36f85bde40ee43e81ef184e618547351f8b84ef3a6b07e81e1f44
            args:
              - web
              - --addr
              - 0.0.0.0:3430
              - --no-open
            env:
              TZ: ${TIMEZONE}
              MAGPIE_ADDR: 0.0.0.0:3425
              MAGPIE_PUBLIC_URL: https://magpie-api.${SECRET_DOMAIN}
              MAGPIE_WEB_KEY:
                secretKeyRef:
                  name: magpie-secret
                  key: MAGPIE_WEB_KEY
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /magpie
                      - healthcheck
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          gateway:
            port: 3425
          web:
            port: 3430
    route:
      gateway:
        hostnames:
          - "magpie-api.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 3425
      web:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 3430
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
