---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: magpie
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: magpie-secret
    template:
      engineVersion: v2
      data:
        MAGPIE_WEB_KEY: "{{ .MAGPIE_WEB_KEY }}"
  data:
    - secretKey: MAGPIE_WEB_KEY
      remoteRef:
        key: MAGPIE_WEB_KEY
        property: password
