---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: clash-exporter
spec:
  groups:
    # The raw metric carries a `destination` (domain) label, which is high
    # cardinality and only useful for short-term investigation. These recorded
    # series keep the long-term view cheap.
    - name: clash-exporter.record
      interval: 1m
      rules:
        # Long-term per-policy totals. Answers "how much did 漏网之鱼 use this
        # month" without keeping 1000s of domain series around.
        - record: clash:traffic_bytes:sum_by_policy
          expr: |
            sum without (source, destination, job, instance) (
              increase(clash_network_traffic_bytes_total[5m])
            )
        # Per-domain totals with the policy dimension kept, so you can see which
        # group a domain actually landed in.
        - record: clash:traffic_bytes:sum_by_destination
          expr: |
            sum without (source, job, instance) (
              increase(clash_network_traffic_bytes_total[5m])
            )
