---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: clash-exporter
spec:
  groups:
    # The raw metrics carry a `destination` (domain) label, which is high
    # cardinality. These recorded series pre-aggregate the counters so that a
    # 30d `increase()` scans ~10 series instead of thousands.
    #
    # They record the *counter*, not a pre-computed increase: increase() over a
    # recorded increase is meaningless, increase() over a recorded counter is
    # exactly what you want.
    #
    # Label meanings on the raw metrics:
    #   policy = final outbound proxy (chains[0]), e.g. 🇸🇬 新加坡01
    #   group  = rule group that selected it (chains[-1]), e.g. 🐟 漏网之鱼
    - name: clash-exporter.record
      interval: 1m
      rules:
        - record: clash:traffic_bytes:total_by_group
          expr: |
            sum without (source, destination, policy, job, instance) (
              clash_network_traffic_bytes_total
            )
        - record: clash:traffic_bytes:total_by_policy
          expr: |
            sum without (source, destination, job, instance) (
              clash_network_traffic_bytes_total
            )
        - record: clash:traffic_bytes:total_by_destination
          expr: |
            sum without (source, policy, job, instance) (
              clash_network_traffic_bytes_total
            )
        - record: clash:connections:total_by_group
          expr: |
            sum without (source, destination, policy, job, instance) (
              clash_connections_total
            )
        - record: clash:connections:total_by_destination
          expr: |
            sum without (source, policy, job, instance) (
              clash_connections_total
            )
