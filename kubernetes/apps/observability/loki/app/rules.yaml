---
# Loki ruler 规则。挂载到 /var/loki/rules/fake/（auth_enabled=false 时租户固定为 fake）。
# 告警经 Alertmanager 转发到 Pushover。
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
data:
  alerts.yaml: |
    groups:
      - name: app-log-errors
        interval: 1m
        rules:
          # 只匹配进程级崩溃签名，不匹配字面 "fatal"/"error"。
          # 踩过的坑：git 的 `fatal: detected dubious ownership`、commit message 里带关键字、
          # 以及 Grafana 把自己发出的查询语句写进日志（会把模式文本回显一遍）。
          - alert: LogPanicOrFatal
            expr: |
              sum by (namespace, pod) (
                count_over_time({namespace=~".+"}
                  |~ `(?i)(panic:|fatal error|OOMKilled|SIGSEGV|OutOfMemoryError|goroutine \d+ \[running\])`
                  !~ `pluginId=loki|logger=tsdb`
                  [5m])
              ) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} 出现 panic/fatal/OOMKilled"
              description: "近 5 分钟命中 {{ $value }} 条日志"
