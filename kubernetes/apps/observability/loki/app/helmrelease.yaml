---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  timeout: 5m
  chart:
    spec:
      chart: loki
      version: 7.5.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      strategy: rollback
      retries: 3
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      analytics:
        reporting_enabled: false
      server:
        log_level: warn
      commonConfig:
        replication_factor: 1
      resources:
        limits:
          memory: 4Gi
        requests:
          cpu: 10m
          memory: 256Mi
      ingester:
        chunk_encoding: snappy
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01" # quote
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 7d
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
        compaction_interval: 10m
        apply_retention_interval: 10m
        retention_delete_delay: 2h
      # chart 只读 loki.rulerConfig（不是 loki.ruler），写错位置会被静默忽略
      rulerConfig:
        alertmanager_url: http://alertmanager-operated.observability.svc.cluster.local:9093
        enable_api: true
        enable_alertmanager_v2: true
        rule_path: /var/loki/rules-temp
        storage:
          type: local
          local:
            directory: /var/loki/rules
        ring:
          kvstore:
            store: inmemory
        wal:
          dir: /var/loki/ruler-wal
    singleBinary:
      replicas: 1
      extraVolumes:
        - name: loki-rules
          configMap:
            name: loki-rules
      extraVolumeMounts:
        # auth_enabled=false 时租户固定为 fake，ruler 只读 /var/loki/rules/<tenant>/
        - name: loki-rules
          mountPath: /var/loki/rules/fake
      persistence:
        enabled: true
        storageClass: topolvm-thin-provisioner
        # 实际 PVC 已手动扩到 16Gi；StatefulSet volumeClaimTemplates 不可变，
        # 改这里会让 Helm upgrade 失败，重建 STS 时才需要同步。
        size: 8Gi
    gateway:
      replicas: 0
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
