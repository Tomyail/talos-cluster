---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: promtail
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 6.17.1
  url: oci://ghcr.io/grafana/helm-charts/promtail
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: promtail
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: promtail
    config:
      clients:
        - url: http://loki-headless.observability.svc.cluster.local:3100/loki/api/v1/push
      snippets:
        # 采集端过滤噪音：健康检查与 gatus 每次探测的流水账，
        # 24h 内占总量约 18%，且不含排障信息。
        pipelineStages:
          - cri: {}
          - drop:
              expression: ".*(?:/healthz|NodeGetVolumeStats|All records are already up to date).*"
              drop_counter_reason: healthcheck_noise
          - drop:
              expression: ".*\\[watchdog\\.executeEndpoint\\].*"
              drop_counter_reason: gatus_watchdog_noise
    serviceMonitor:
      enabled: true